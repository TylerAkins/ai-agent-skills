name: Prepare release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      release_tag: ${{ steps.candidate.outputs.release_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release from manifest
        id: candidate
        run: |
          set -euo pipefail
          version=$(jq -r .version plugin.json)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          RELEASE_TAG="v${version}"
          candidate=$(git rev-parse HEAD)
          if git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null 2>&1; then
            existing=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
            if [ "$existing" != "$candidate" ]; then
              echo "::error::Tag ${RELEASE_TAG} points to ${existing}, but main is ${candidate}. Delete or move the tag, or bump the manifest."
              exit 1
            fi
          fi
          echo "sha=${candidate}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify candidate
        run: |
          test -z "$(gofmt -l cmd internal)"
          go test -race ./...
          go vet ./...
          go run ./cmd/skillpack
      - name: Build release bundles
        env:
          RELEASE_TAG: ${{ steps.candidate.outputs.release_tag }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          mkdir "$RUNNER_TEMP/bundles"
          for host in cursor codex claude copilot opencode; do
            package="ai-agent-skills-$host"
            go run ./cmd/skillpack -target "$host" -out "$RUNNER_TEMP/$package"
            tar -czf "$RUNNER_TEMP/bundles/$package-$RELEASE_TAG.tar.gz" -C "$RUNNER_TEMP" "$package"
          done
          cd "$RUNNER_TEMP/bundles"
          printf '%s\n' "$CANDIDATE_SHA" > SOURCE_COMMIT
          sha256sum ./*.tar.gz SOURCE_COMMIT > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundles
          path: ${{ runner.temp }}/bundles/
          if-no-files-found: error
          retention-days: 7

  draft:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-bundles
          path: bundles
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          CANDIDATE_SHA: ${{ needs.build.outputs.sha }}
        run: |
          set -euo pipefail
          cd bundles
          sha256sum --check SHA256SUMS
          test "$(cat SOURCE_COMMIT)" = "$CANDIDATE_SHA"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            draft=$(gh release view "$RELEASE_TAG" --json isDraft -q .isDraft)
            if [ "$draft" != "true" ]; then
              echo "::error::Release ${RELEASE_TAG} already exists and is not a draft."
              exit 1
            fi
            echo "::error::Draft release ${RELEASE_TAG} already exists. Delete it or publish before re-running."
            exit 1
          fi
          gh release create "$RELEASE_TAG" ./*.tar.gz SHA256SUMS SOURCE_COMMIT \
            --target "$CANDIDATE_SHA" \
            --draft \
            --title "$RELEASE_TAG" \
            --notes "Host skill bundles built from commit ${CANDIDATE_SHA}. Review host behavior and release notes before publishing."
