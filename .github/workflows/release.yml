name: Prepare release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      release_tag: ${{ steps.candidate.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release from manifest
        id: candidate
        run: |
          set -euo pipefail
          version=$(jq -r .version plugin.json)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          RELEASE_TAG="v${version}"
          candidate=$(git rev-parse HEAD)
          if git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null 2>&1; then
            existing=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
            if [ "$existing" != "$candidate" ]; then
              echo "::error::Tag ${RELEASE_TAG} points to ${existing}, but main is ${candidate}. Delete or move the tag, or bump the manifest."
              exit 1
            fi
          fi
          echo "sha=${candidate}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Ensure ShellCheck is available
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes shellcheck
          fi
      - name: Verify candidate
        run: |
          printf 'Checking source formatting and shell scripts.\n'
          files=$(gofmt -l cmd internal)
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
          bash scripts/ci/check-shell.sh
          go test -v -race ./...
          go vet ./...
          go run ./cmd/skillpack
      - name: Build release bundles
        env:
          RELEASE_TAG: ${{ steps.candidate.outputs.release_tag }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          mkdir "$RUNNER_TEMP/bundles"
          for host in cursor claude portable skills; do
            printf '::group::Package %s\n' "$host"
            package="ai-agent-skills-$host"
            go run ./cmd/skillpack -target "$host" -out "$RUNNER_TEMP/$package"
            tar -czf "$RUNNER_TEMP/bundles/$package-$RELEASE_TAG.tar.gz" -C "$RUNNER_TEMP" "$package"
            printf '::endgroup::\n'
          done
          cd "$RUNNER_TEMP/bundles"
          printf '%s\n' "$CANDIDATE_SHA" > SOURCE_COMMIT
          sha256sum ./*.tar.gz SOURCE_COMMIT > SHA256SUMS
          cat SHA256SUMS
          printf '## Release bundles\n\nTag: %s\n\nSource: %s\n\n' "$RELEASE_TAG" "$CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf 'Four archives built: Cursor, Claude, portable plugin, and skills-only. Draft creation runs in the next job.\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundles
          path: ${{ runner.temp }}/bundles/
          if-no-files-found: error
          retention-days: 7

  draft:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundles
          path: bundles
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          CANDIDATE_SHA: ${{ needs.build.outputs.sha }}
        run: |
          set -euo pipefail
          (
            cd bundles
            sha256sum --check SHA256SUMS
            test "$(cat SOURCE_COMMIT)" = "$CANDIDATE_SHA"
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            draft=$(gh release view "$RELEASE_TAG" --json isDraft -q .isDraft)
            if [ "$draft" != "true" ]; then
              echo "::error::Release ${RELEASE_TAG} already exists and is not a draft."
              exit 1
            fi
            echo "::error::Draft release ${RELEASE_TAG} already exists. Delete it or publish before re-running."
            exit 1
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Bundles built from commit ${CANDIDATE_SHA}. Review host behavior before publishing.

          | Archive | Hosts |
          | --- | --- |
          | cursor | Cursor |
          | claude | Claude Code |
          | portable | Codex, Copilot |
          | skills | OpenCode, Gemini CLI, Muse Code, Antigravity |

          Update your installer checkout before using this release. Older installers expect separate Codex, Copilot, and OpenCode archives. Updated installers also support legacy releases.
          EOF
          gh release create "$RELEASE_TAG" bundles/*.tar.gz bundles/SHA256SUMS bundles/SOURCE_COMMIT \
            --target "$CANDIDATE_SHA" \
            --draft \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
