name: Prepare release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag on main matching the manifest version (v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and select release candidate
        id: candidate
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          candidate=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$candidate" origin/main
          git checkout --detach "$candidate"
          test "$RELEASE_TAG" = "v$(jq -r .version plugin.json)"
          echo "sha=$candidate" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify candidate
        run: |
          test -z "$(gofmt -l cmd internal)"
          go test -race ./...
          go vet ./...
          go run ./cmd/skillpack
      - name: Build release bundles
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          mkdir "$RUNNER_TEMP/bundles"
          for host in cursor codex claude copilot opencode; do
            package="ai-agent-skills-$host"
            go run ./cmd/skillpack -target "$host" -out "$RUNNER_TEMP/$package"
            tar -czf "$RUNNER_TEMP/bundles/$package-$RELEASE_TAG.tar.gz" -C "$RUNNER_TEMP" "$package"
          done
          cd "$RUNNER_TEMP/bundles"
          printf '%s\n' "$CANDIDATE_SHA" > SOURCE_COMMIT
          sha256sum ./*.tar.gz SOURCE_COMMIT > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundles
          path: ${{ runner.temp }}/bundles/
          if-no-files-found: error
          retention-days: 7

  draft:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-bundles
          path: bundles
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_SHA: ${{ needs.build.outputs.sha }}
        run: |
          cd bundles
          sha256sum --check SHA256SUMS
          test "$(cat SOURCE_COMMIT)" = "$CANDIDATE_SHA"
          current=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          test "$current" = "$CANDIDATE_SHA"
          gh release create "$RELEASE_TAG" ./*.tar.gz SHA256SUMS SOURCE_COMMIT \
            --verify-tag --draft --title "$RELEASE_TAG" \
            --notes "Host skill bundles built from commit $CANDIDATE_SHA. Review host behavior and release notes before publishing."
