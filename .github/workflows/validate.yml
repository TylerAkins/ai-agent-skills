name: Validate collection

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Validate source
        run: go run ./cmd/skillpack
      - name: Build and validate host packages
        run: |
          go run ./cmd/skillpack -target cursor -out "$RUNNER_TEMP/cursor-package"
          go run ./cmd/skillpack -target codex -out "$RUNNER_TEMP/codex-package"
          go run ./cmd/skillpack -target claude -out "$RUNNER_TEMP/claude-package"
          go run ./cmd/skillpack -target copilot -out "$RUNNER_TEMP/copilot-package"
          go run ./cmd/skillpack -target opencode -out "$RUNNER_TEMP/opencode-package"
